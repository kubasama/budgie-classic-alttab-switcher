name       : budgie-classic-alttab-switcher
version    : 0.1.0
release    : 1
source     :
    - https://github.com/kubasama/budgie-classic-alttab-switcher/archive/refs/tags/v0.1.0.tar.gz : SHA256_OF_THE_RELEASE_TARBALL
homepage   : https://github.com/kubasama/budgie-classic-alttab-switcher
license    : GPL-2.0-or-later
component  : desktop.budgie
summary    : Icon-grid Alt+Tab window switcher for Budgie on Wayland
description: |
    An Alt+Tab switcher for Budgie's Wayland (labwc) session in the style of the
    switcher Budgie had before 10.10: app icons in centered rows with the selected
    window's title underneath, most recently used first. Each user runs
    "budgie-classic-alttab-switcher enable" once to bind Alt+Tab.
builddeps  :
    - pkgconfig(gtk+-3.0)
    - pkgconfig(gtk-layer-shell-0)
    - pkgconfig(libxfce4windowing-0)
    - vala
setup      : |
    %meson_configure
build      : |
    %ninja_build
install    : |
    %ninja_install
